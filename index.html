<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Quiz - Minor Project</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.Tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-xl">

    <!-- Start Screen -->
    <div id="startScreen" class="text-center">
      <h1 class="text-2xl font-bold mb-4">Online Quiz Application</h1>
      <button onclick="startQuiz()" class="btn-primary">
        Start Quiz
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="hidden">
      <h2 id="question" class="text-lg font-semibold mb-4"></h2>
      <div id="options" class="space-y-2"></div>

      <button onclick="nextQuestion()" class="btn-success mt-4">
        Next
      </button>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-3">Quiz Completed 🎉</h2>
      <p id="score" class="text-lg font-semibold"></p>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
